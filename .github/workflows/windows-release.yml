name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 0.11.28
          enable-cache: true

      - name: Install backend development dependencies
        run: uv sync --project server --extra dev --locked

      - name: Verify Windows launchers, settings, and authored capability text
        working-directory: server
        run: >-
          uv run pytest
          ../.test/security/test_settings.py
          ../.test/security/test_system_settings.py
          ../.test/security/test_windows_launchers.py
          ../.test/authoring/test_capability_manifest.py
          -q

      - name: Verify public source surface
        run: uv run --project server python packaging/release/check_release_surface.py

      - name: Build self-contained Windows archive
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File packaging/windows/build_portable.ps1
          -ProjectRoot ${{ github.workspace }}
          -SkipFrontend

      - name: Smoke-test moved portable archive
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "moved-agent-shell"
          Expand-Archive -LiteralPath release/agent-shell-windows-x64.zip -DestinationPath $destination
          $portableHome = Join-Path $destination "agent-shell-windows-x64"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/release/smoke_portable.ps1 -PortableRoot $portableHome

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $manifest = Get-Content -LiteralPath release/agent-shell-windows-x64/release-manifest.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match application version $expectedTag."
          }

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/agent-shell-windows-x64.zip
            release/agent-shell-windows-x64.zip.sha256
