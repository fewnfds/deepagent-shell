name: Container release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan changed source for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("server/pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Build Linux amd64 image
        run: docker build --platform linux/amd64 --tag agent-shell:ci .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          name="agent-shell-smoke"
          cleanup() { docker rm --force "${name}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "${name}" \
            --publish 127.0.0.1:19100:19100 \
            --env AGENT_SHELL_HOST=0.0.0.0 \
            --env AGENT_SHELL_PORT=19100 \
            --env AGENT_SHELL_ALLOW_REMOTE=true \
            --env AGENT_SHELL_MANAGEMENT_TOKEN=container-smoke-shared-token-0001 \
            --env AGENT_SHELL_INFERENCE_TOKEN=container-smoke-shared-token-0001 \
            agent-shell:ci \
            python -I -B -m agent_shell --home /app --data-dir /app/data --mode environment
          healthy=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19100/api/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "${healthy}" != true ]; then
            docker logs "${name}"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:19100/admin/ >/dev/null
          curl --fail --silent \
            --header 'Authorization: Bearer container-smoke-shared-token-0001' \
            http://127.0.0.1:19100/api/catalog >/dev/null
          curl --fail --silent \
            --header 'Authorization: Bearer container-smoke-shared-token-0001' \
            http://127.0.0.1:19100/v1/models >/dev/null
          test "$(docker image inspect agent-shell:ci --format '{{.Architecture}}')" = "amd64"
          test "$(docker exec "${name}" id -u)" != "0"
          docker exec "${name}" test -f /app/data/state/agent-shell.sqlite3
          docker exec "${name}" test ! -e /app/.env
          docker exec "${name}" sh -c \
            'test -z "$(find /opt/venv -name direct_url.json -type f -print -quit)"'
          docker exec "${name}" python -I -B -c \
            "import importlib.util; assert not any(importlib.util.find_spec(name) for name in ('httptools', 'uvloop', 'watchfiles'))"
          docker exec "${name}" sh -c \
            '! command -v node >/dev/null && ! command -v uv >/dev/null'

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          for tag in "${version}" "${minor}" latest; do
            docker tag agent-shell:ci "${image}:${tag}"
            docker push "${image}:${tag}"
          done
