name: agent-shell

services:
  agent-shell:
    image: "${AGENT_SHELL_IMAGE:-ghcr.io/fewnfds/agent-shell:latest}"
    env_file:
      - "${COMPOSE_DATA_DIR:-./data}/config/agent-shell.env"
    ports:
      - "${AGENT_SHELL_PORT:-19100}:${AGENT_SHELL_PORT:-19100}"
    volumes:
      - type: bind
        source: "${COMPOSE_DATA_DIR:-./data}"
        target: /app/data
        bind:
          create_host_path: false
    tmpfs:
      - /app/runtime:uid=${AGENT_SHELL_UID:-10001},gid=${AGENT_SHELL_GID:-10001},mode=0700
    user: "${AGENT_SHELL_UID:-10001}:${AGENT_SHELL_GID:-10001}"
    restart: unless-stopped
