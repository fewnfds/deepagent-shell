[project]
name = "agent-shell-server"
version = "0.2.0"
description = "Local configuration collection shell for additive LangChain Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
  "deepagents==0.7.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "httpx-curl-cffi>=0.1.5,<0.2",
  "langchain>=1.3.14,<2.0",
  "langchain-anthropic>=1.5.3,<2.0",
  "langchain-core>=1.5.3,<2.0",
  "langchain-deepseek>=1.1.0,<2.0",
  "langchain-google-genai>=4.3.2,<5.0",
  "langchain-google-vertexai>=3.2.4,<4.0",
  "langchain-openai>=1.4.1,<2.0",
  "langchain-xai>=1.3.0,<2.0",
  "langgraph>=1.2.10,<1.3.0",
  "pydantic-settings>=2.10.1",
  "pyyaml>=6.0.2",
  "uvicorn>=0.35.0",
  "websockets>=15.0.1,<16.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7.0,<3.0",
  "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_shell"]

[tool.pytest.ini_options]
pythonpath = ["src"]
